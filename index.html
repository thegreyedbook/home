<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>thegreyedbook · repositories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME
   ============================================================ */
:root{
  --bg:        #0f1117;
  --panel:     #161922;
  --panel-2:   #1b1f2a;
  --line:      #262b38;
  --text:      #e7eaf1;
  --muted:     #8a93a6;
  --faint:     #545c6d;
  --accent:    #3fb9c9;
  --accent-dim:#2a7c88;
  --err:       #e0a458;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(900px 500px at 78% -8%, rgba(63,185,201,.07), transparent 60%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);font-weight:400;line-height:1.5;
  -webkit-font-smoothing:antialiased;min-height:100dvh;
  display:flex;justify-content:center;
  padding:clamp(16px,4vw,52px) clamp(14px,4vw,24px);
}
.wrap{width:100%;max-width:760px}

/* ---- console bar ---- */
.console{
  border:1px solid var(--line);border-radius:12px 12px 0 0;
  background:var(--panel-2);padding:11px 14px;
  display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:13px;color:var(--muted);
}
.dots{display:flex;gap:6px;flex:0 0 auto}
.dots span{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots span:nth-child(1){background:#e05561}
.dots span:nth-child(2){background:#e0a458}
.dots span:nth-child(3){background:#3fb28b}
.prompt{
  white-space:nowrap;overflow:hidden;border-right:2px solid var(--accent);
  animation:type 1.05s steps(34,end) 1 both, blink .9s step-end infinite;
}
.prompt .user{color:var(--accent)}
.prompt .cmd{color:var(--text)}
@keyframes type{from{width:0}to{width:100%}}
@keyframes blink{50%{border-color:transparent}}

/* ---- panel ---- */
.panel{
  border:1px solid var(--line);border-top:none;border-radius:0 0 12px 12px;
  background:var(--panel);padding:clamp(22px,5vw,38px);
}

/* ---- identity ---- */
.id{display:flex;gap:18px;align-items:center;margin-bottom:32px}
.avatar-wrap{width:72px;height:72px;flex:0 0 auto;position:relative}
.avatar{
  width:72px;height:72px;border-radius:14px;
  border:1px solid var(--line);object-fit:cover;background:var(--panel-2);display:block;
}
.avatar-fallback{
  position:absolute;inset:0;display:none;align-items:center;justify-content:center;
  border-radius:14px;border:1px solid var(--line);background:var(--panel-2);
  font-family:var(--mono);font-size:28px;font-weight:600;color:var(--accent);
}
.id h1{
  margin:0;font-family:var(--mono);font-weight:600;
  font-size:clamp(20px,4vw,26px);letter-spacing:-.01em;line-height:1.1;
}
.handle{
  font-family:var(--mono);font-size:14px;color:var(--accent);
  text-decoration:none;display:inline-block;margin-top:2px;
}
.handle:hover{text-decoration:underline}
.tagline{color:var(--muted);font-size:14.5px;margin-top:7px;max-width:52ch}

/* ---- listing header ---- */
.listing-head{
  font-family:var(--mono);font-size:12.5px;color:var(--faint);
  padding-bottom:10px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;align-items:center;
}
.listing-head .refreshing{color:var(--accent-dim);opacity:0;transition:opacity .2s}
.listing-head .refreshing.on{opacity:1}

/* ---- repo rows ---- */
.repo{
  position:relative;
  display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:baseline;
  padding:16px 12px 16px 14px;margin:0 -12px 0 -14px;
  border-bottom:1px solid var(--line);border-left:2px solid transparent;
  transition:background .15s ease, border-color .15s ease;
}
.repo:hover,.repo:focus-within{background:var(--panel-2);border-left-color:var(--accent)}
/* the repo name is the primary link; ::after stretches it over the whole row */
.repo-name{
  grid-column:1;grid-row:1;
  font-family:var(--mono);font-size:16px;font-weight:500;color:var(--text);text-decoration:none;
}
.repo-name::after{content:"";position:absolute;inset:0;z-index:1}
.repo:hover .repo-name{color:var(--accent)}
.repo-name:focus-visible{outline:2px solid var(--accent-dim);outline-offset:3px;border-radius:3px}
.repo-lang{
  grid-column:2;grid-row:1;font-family:var(--mono);font-size:12px;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.repo-desc{grid-column:1;grid-row:2;color:var(--muted);font-size:14px;margin-top:4px;max-width:56ch}
.repo-desc.empty{font-family:var(--mono);color:var(--faint);font-size:13px}
/* small secondary link straight to the deployed asset */
.asset{
  grid-column:2;grid-row:2;justify-self:end;align-self:center;
  position:relative;z-index:2;white-space:nowrap;
  font-family:var(--mono);font-size:12px;color:var(--accent);text-decoration:none;
  border:1px solid var(--accent-dim);border-radius:7px;padding:4px 10px;
  transition:background .15s ease, border-color .15s ease;
}
.asset:hover{background:rgba(63,185,201,.13);border-color:var(--accent)}
.asset:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.asset .arr{opacity:.7}

/* ---- footer ---- */
.foot{margin-top:26px;font-family:var(--mono);font-size:12.5px;color:var(--faint)}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--accent)}

@media (max-width:460px){
  .repo{grid-template-columns:1fr}
  .repo-lang{grid-column:1;grid-row:auto;margin-top:2px}
  .repo-desc{grid-column:1;grid-row:auto;max-width:none}
  .asset{grid-column:1;grid-row:auto;justify-self:start;margin-top:10px}
}
@media (prefers-reduced-motion:reduce){
  .prompt{animation:none;border-right-color:transparent;width:100%}
  .repo,.asset,.refreshing{transition:none}
}
</style>
</head>
<body>
<main class="wrap">

  <div class="console">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="prompt"><span class="user" id="promptUser"></span><span class="cmd"> ls ./repositories</span></div>
  </div>

  <section class="panel">
    <div class="id">
      <div class="avatar-wrap">
        <img class="avatar" id="avatar" alt="" onerror="this.style.display='none';document.getElementById('avatarFallback').style.display='flex'">
        <div class="avatar-fallback" id="avatarFallback" aria-hidden="true"></div>
      </div>
      <div>
        <h1 id="name"></h1>
        <a class="handle" id="handle" href="#" target="_blank" rel="noopener"></a>
        <div class="tagline" id="tagline"></div>
      </div>
    </div>

    <div class="listing-head">
      <span id="count">repositories</span>
      <span class="refreshing" id="refreshing">syncing…</span>
    </div>

    <nav id="repos" aria-label="Repositories"></nav>

    <div class="foot"><span id="footNote"></span></div>
  </section>

</main>

<script>
/* ============================================================
   CONFIG — the only part you edit.
   ============================================================ */

const USERNAME = "thegreyedbook";

const PROFILE = {
  name:    "thegreyedbook",
  tagline: "SQL Server · data engineering & BI. Reports, warehouse views, and side projects."
};

const OPTIONS = {
  sort:         "pushed",   // "pushed" (recent activity) | "updated" | "created" | "full_name" (A to Z)
  includeForks: false,
  limit:        null        // e.g. 6 to cap; null = all public repos
};

// Repos to leave OUT of the list (this landing page's own repo, etc.).
const EXCLUDE = ["home"];

// If non-empty, ONLY these show, in this order. Leave [] to auto-list.
const PINNED = [];

/* Baked-in snapshot: shown instantly, and whenever the live GitHub call
   can't run (e.g. a sandboxed preview). On the deployed site the live
   fetch quietly refreshes this with the latest from GitHub. */
const SNAPSHOT = [
  { name:"FFdraft",        description:"Fantasy Football Draft Warroom",                               language:"HTML",       asset:"https://thegreyedbook.github.io/FFdraft/" },
  { name:"csvCompare",     description:"Compare Two CSV Files",                                         language:"HTML",       asset:"https://thegreyedbook.github.io/csvCompare/" },
  { name:"retire",         description:"401k Calculator",                                               language:"HTML",       asset:"https://thegreyedbook.github.io/retire/" },
  { name:"circuit",        description:null,                                                            language:"HTML",       asset:"https://thegreyedbook.github.io/circuit/" },
  { name:"perfect_season", description:"Try to go 162-0 by drafting 80s, 90s, and 2000s MLB players",   language:"HTML",       asset:"https://thegreyedbook.github.io/perfect_season/" },
  { name:"buzzard",        description:"escrow tracking",                                               language:"TypeScript", asset:null },
];

/* ============================================================
   No need to edit below.
   ============================================================ */

const LANG_COLORS = {
  "TSQL":"#e0a458","PLpgSQL":"#e0a458","SQL":"#e0a458","C#":"#9d6dd6",
  "Python":"#4b8bbe","JavaScript":"#e0c341","TypeScript":"#3178c6","HTML":"#e05561",
  "CSS":"#563d7c","R":"#4b8bbe","Shell":"#3fb28b","PowerShell":"#4a8fd6","Vue":"#41b883","Jupyter Notebook":"#e0a458"
};

const $ = (id) => document.getElementById(id);

$("promptUser").textContent = USERNAME + "@github:~$";
$("name").textContent = PROFILE.name;
$("tagline").textContent = PROFILE.tagline;

const handle = $("handle");
handle.textContent = "github.com/" + USERNAME;
handle.href = "https://github.com/" + USERNAME;

$("avatar").src = "https://github.com/" + USERNAME + ".png?size=200";
$("avatar").alt = PROFILE.name;
$("avatarFallback").textContent = (PROFILE.name[0] || USERNAME[0] || "?").toUpperCase();

$("footNote").innerHTML = "// github.com/" + escapeHtml(USERNAME) + " — self-updating";

// 1) Paint the snapshot immediately so the page is never empty.
render(SNAPSHOT.map(r => ({ ...r, url:"https://github.com/" + USERNAME + "/" + r.name, asset:r.asset || null })));

// 2) Try to refresh from the live GitHub API (works on the deployed site).
refresh();

async function refresh(){
  $("refreshing").classList.add("on");
  const url = "https://api.github.com/users/" + USERNAME +
              "/repos?per_page=100&type=owner&sort=" + encodeURIComponent(OPTIONS.sort);
  try{
    const res = await fetch(url, { headers:{ "Accept":"application/vnd.github+json" } });
    if(!res.ok) throw new Error("HTTP " + res.status);
    let repos = await res.json();

    if(!OPTIONS.includeForks) repos = repos.filter(r => !r.fork);
    const skip = new Set(EXCLUDE.map(s => s.toLowerCase()));
    repos = repos.filter(r => !skip.has(r.name.toLowerCase()));

    if(PINNED.length){
      const byName = Object.fromEntries(repos.map(r => [r.name.toLowerCase(), r]));
      repos = PINNED.map(n => byName[n.toLowerCase()]).filter(Boolean);
    }
    if(OPTIONS.limit) repos = repos.slice(0, OPTIONS.limit);

    if(repos.length){
      render(repos.map(r => ({
        name:r.name, description:r.description, language:r.language, url:r.html_url,
        asset: (r.homepage && r.homepage.trim())
                 ? r.homepage.trim()
                 : (r.has_pages ? ("https://" + USERNAME + ".github.io/" + r.name + "/") : null)
      })));
    }
  }catch(err){
    /* Offline or rate-limited: the snapshot is already on screen. */
  }finally{
    $("refreshing").classList.remove("on");
  }
}

function render(list){
  const c = $("repos");
  c.innerHTML = "";
  $("count").textContent = list.length + " " + (list.length === 1 ? "repository" : "repositories");

  for(const r of list){
    const color = LANG_COLORS[r.language] || "#8a93a6";
    const row = document.createElement("div");
    row.className = "repo";
    row.innerHTML =
      '<a class="repo-name" href="' + escapeAttr(r.url) + '" target="_blank" rel="noopener">' + escapeHtml(r.name) + '</a>' +
      (r.language ? '<span class="repo-lang"><span class="dot" style="background:'+color+'"></span>'+escapeHtml(r.language)+'</span>' : '') +
      (r.description
        ? '<span class="repo-desc">' + escapeHtml(r.description) + '</span>'
        : '<span class="repo-desc empty">// add a description on github</span>') +
      (r.asset
        ? '<a class="asset" href="' + escapeAttr(r.asset) + '" target="_blank" rel="noopener" aria-label="Open the live ' + escapeAttr(r.name) + '">live <span class="arr">↗</span></a>'
        : '');
    c.appendChild(row);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s){ return escapeHtml(s); }   // hoisted; same escaping is safe for attributes
</script>
</body>
</html>

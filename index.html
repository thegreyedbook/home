<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Repositories</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   THEME
   ============================================================ */
:root{
  --bg:        #0f1117;
  --panel:     #161922;
  --panel-2:   #1b1f2a;
  --line:      #262b38;
  --text:      #e7eaf1;
  --muted:     #8a93a6;
  --faint:     #545c6d;
  --accent:    #3fb9c9;         /* considered teal-cyan */
  --accent-dim:#2a7c88;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-weight:400;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  padding:clamp(16px,4vw,48px) clamp(14px,4vw,24px);
}
.wrap{
  width:100%;
  max-width:760px;
}

/* ============================================================
   CONSOLE BAR
   ============================================================ */
.console{
  border:1px solid var(--line);
  border-radius:10px 10px 0 0;
  background:var(--panel-2);
  padding:11px 14px;
  display:flex;
  align-items:center;
  gap:10px;
  font-family:var(--mono);
  font-size:13px;
  color:var(--muted);
}
.dots{display:flex;gap:6px;flex:0 0 auto}
.dots span{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots span:nth-child(1){background:#e05561}
.dots span:nth-child(2){background:#e0a458}
.dots span:nth-child(3){background:#3fb28b}
.prompt{
  white-space:nowrap;overflow:hidden;
  border-right:2px solid var(--accent);
  animation:type 1.1s steps(30,end) 1 both, blink .9s step-end infinite;
}
.prompt .user{color:var(--accent)}
.prompt .cmd{color:var(--text)}
@keyframes type{from{width:0}to{width:100%}}
@keyframes blink{50%{border-color:transparent}}

/* ============================================================
   PANEL
   ============================================================ */
.panel{
  border:1px solid var(--line);
  border-top:none;
  border-radius:0 0 10px 10px;
  background:var(--panel);
  padding:clamp(22px,5vw,36px);
}

/* ---- identity ---- */
.id{display:flex;gap:18px;align-items:center;margin-bottom:30px}
.avatar{
  width:72px;height:72px;flex:0 0 auto;border-radius:12px;
  border:1px solid var(--line);object-fit:cover;background:var(--panel-2);
}
.avatar-fallback{
  display:none;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:26px;font-weight:600;color:var(--accent);
}
.id h1{
  margin:0;font-family:var(--mono);font-weight:600;
  font-size:clamp(20px,4vw,26px);letter-spacing:-.01em;line-height:1.1;
}
.handle{
  font-family:var(--mono);font-size:14px;color:var(--accent);
  text-decoration:none;display:inline-block;margin-top:2px;
}
.handle:hover{text-decoration:underline}
.tagline{color:var(--muted);font-size:14.5px;margin-top:7px;max-width:52ch}

/* ---- listing header ---- */
.listing-head{
  font-family:var(--mono);font-size:12.5px;color:var(--faint);
  padding-bottom:10px;border-bottom:1px solid var(--line);
  display:flex;justify-content:space-between;
}

/* ---- repo rows ---- */
.repo{
  display:grid;
  grid-template-columns:1fr auto;
  gap:2px 14px;
  align-items:baseline;
  padding:16px 12px 16px 14px;
  margin:0 -12px 0 -14px;
  border-bottom:1px solid var(--line);
  border-left:2px solid transparent;
  text-decoration:none;color:inherit;
  transition:background .15s ease, border-color .15s ease;
}
.repo:hover,.repo:focus-visible{
  background:var(--panel-2);
  border-left-color:var(--accent);
  outline:none;
}
.repo:focus-visible{border-left-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-dim)}
.repo-name{
  font-family:var(--mono);font-size:16px;font-weight:500;color:var(--text);
  grid-column:1;
}
.repo:hover .repo-name{color:var(--accent)}
.repo-lang{
  grid-column:2;grid-row:1;
  font-family:var(--mono);font-size:12px;color:var(--muted);
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:0 0 auto}
.repo-desc{
  grid-column:1 / -1;grid-row:2;
  color:var(--muted);font-size:14px;margin-top:4px;max-width:60ch;
}
.open{
  grid-column:2;grid-row:2;align-self:end;
  font-family:var(--mono);font-size:12px;color:var(--accent);
  opacity:0;transform:translateX(-4px);transition:opacity .15s,transform .15s;
  white-space:nowrap;
}
.repo:hover .open,.repo:focus-visible .open{opacity:1;transform:translateX(0)}

/* ---- footer ---- */
.foot{
  margin-top:26px;font-family:var(--mono);font-size:12.5px;color:var(--faint);
}
.foot a{color:var(--muted);text-decoration:none}
.foot a:hover{color:var(--accent)}

@media (max-width:460px){
  .repo-lang{grid-row:auto;grid-column:1 / -1;margin-top:2px}
  .repo-desc{grid-row:auto}
  .open{display:none}
}
@media (prefers-reduced-motion:reduce){
  .prompt{animation:none;border-right-color:transparent;width:100%}
  *{transition:none !important}
}
</style>
</head>
<body>
<main class="wrap">

  <div class="console">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="prompt"><span class="user" id="promptUser"></span><span class="cmd"> ls ./repositories</span></div>
  </div>

  <section class="panel">
    <div class="id">
      <img class="avatar" id="avatar" alt="" onerror="this.style.display='none';document.getElementById('avatarFallback').style.display='flex'">
      <div class="avatar avatar-fallback" id="avatarFallback" aria-hidden="true"></div>
      <div>
        <h1 id="name"></h1>
        <a class="handle" id="handle" href="#" target="_blank" rel="noopener"></a>
        <div class="tagline" id="tagline"></div>
      </div>
    </div>

    <div class="listing-head">
      <span id="count"></span>
      <span>public</span>
    </div>

    <nav id="repos" aria-label="Repositories"></nav>

    <div class="foot">
      <span id="footNote"></span>
    </div>
  </section>

</main>

<script>
/* ============================================================
   EDIT EVERYTHING BELOW — this is the only part you touch.
   ============================================================ */

const PROFILE = {
  username: "your-github-username",              // used for avatar + repo links
  name:     "Keag",                              // display name
  tagline:  "SQL Server · data engineering & BI. Reports, warehouse views, and the occasional side project."
};

// Add / remove entries freely. Six is just a starting point.
//   name        -> repo name (also the last part of the URL if url is left blank)
//   description -> one line
//   language    -> label shown on the right (see LANG_COLORS for dot colors)
//   url         -> leave "" to auto-build github.com/<username>/<name>, or paste any full URL
const REPOS = [
  { name: "data-warehouse-views", description: "Curated SQL Server views powering executive reporting.", language: "TSQL",   url: "" },
  { name: "report-scheduler",     description: "Custom job scheduling & delivery for SQL-based reports.", language: "C#",     url: "" },
  { name: "lighthouse-dashboard", description: "Single-file BI dashboard for the C-suite.",              language: "HTML",   url: "" },
  { name: "etl-pipelines",        description: "Stored procs and jobs for vendor data ingestion.",        language: "TSQL",   url: "" },
  { name: "query-toolkit",        description: "Reusable snippets, helpers, and diagnostic scripts.",     language: "TSQL",   url: "" },
  { name: "sandbox",              description: "Experiments and one-off tools.",                          language: "JavaScript", url: "" },
];

/* ============================================================
   No need to edit below this line.
   ============================================================ */

const LANG_COLORS = {
  "TSQL":"#e0a458", "SQL":"#e0a458", "C#":"#9d6dd6", "Python":"#4b8bbe",
  "JavaScript":"#e0c341", "TypeScript":"#3178c6", "HTML":"#e05561",
  "CSS":"#563d7c", "R":"#4b8bbe", "Shell":"#3fb28b", "PowerShell":"#4a8fd6"
};

const $ = (id) => document.getElementById(id);
const u = PROFILE.username;

$("promptUser").textContent = u + "@github:~$";
$("name").textContent = PROFILE.name;
$("tagline").textContent = PROFILE.tagline;

const handle = $("handle");
handle.textContent = "@" + u;
handle.href = "https://github.com/" + u;

$("avatar").src = "https://github.com/" + u + ".png?size=200";
$("avatar").alt = PROFILE.name;
$("avatarFallback").textContent = (PROFILE.name[0] || u[0] || "?").toUpperCase();

$("count").textContent = REPOS.length + " " + (REPOS.length === 1 ? "repository" : "repositories");
$("footNote").innerHTML = '// edit the config at the top of this file';

const container = $("repos");
for (const r of REPOS) {
  const href = r.url && r.url.trim() ? r.url : "https://github.com/" + u + "/" + r.name;
  const color = LANG_COLORS[r.language] || "#8a93a6";

  const a = document.createElement("a");
  a.className = "repo";
  a.href = href;
  a.target = "_blank";
  a.rel = "noopener";
  a.innerHTML =
    '<span class="repo-name">' + escapeHtml(r.name) + '</span>' +
    (r.language ? '<span class="repo-lang"><span class="dot" style="background:' + color + '"></span>' + escapeHtml(r.language) + '</span>' : '') +
    '<span class="repo-desc">' + escapeHtml(r.description || "") + '</span>' +
    '<span class="open">open →</span>';
  container.appendChild(a);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
